allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: true

minimumReleaseAgeExclude:
  - cssnano-utils@6.0.4
  - postcss-convert-values@8.0.4
  - postcss-discard-comments@8.0.4
  - postcss-discard-duplicates@8.0.4
  - postcss-discard-overridden@8.0.4
  - postcss-merge-longhand@8.0.4
  - postcss-minify-font-values@8.0.4
  - postcss-minify-params@8.0.4
  - postcss-minify-selectors@8.0.5
  - postcss-normalize-display-values@8.0.4
  - postcss-normalize-positions@8.0.4
  - postcss-normalize-repeat-style@8.0.4
  - postcss-normalize-string@8.0.4
  - postcss-normalize-timing-functions@8.0.4
  - postcss-normalize-unicode@8.0.4
  - postcss-normalize-url@8.0.4
  - postcss-reduce-transforms@8.0.4
  - postcss-unique-selectors@8.0.4
  - stylehacks@8.0.4
  - '@csstools/color-helpers@6.1.2'
  - '@csstools/css-tokenizer@4.0.2'
  - '@csstools/postcss-nested-calc@5.0.2'
  - '@csstools/postcss-syntax-descriptor-syntax-production@2.0.1'
  - '@csstools/selector-resolve-nested@4.0.2'
  - lint-staged@17.6.0
  - postcss-pseudo-class-any-link@11.0.1
  - socket.io-client@4.8.4
  - vue-router@5.4.0
  - '@nuxt/devtools-kit@3.4.4'
  - '@nuxt/devtools-wizard@3.4.4'
  - '@nuxt/devtools@3.4.4'
  - '@csstools/css-color-parser@4.2.7'
  - '@csstools/postcss-alpha-function@2.0.17'
  - '@csstools/postcss-color-function-display-p3-linear@2.0.16'
  - '@csstools/postcss-color-function@5.0.16'
  - '@csstools/postcss-color-mix-function@4.0.16'
  - '@csstools/postcss-color-mix-variadic-function-arguments@2.0.16'
  - '@csstools/postcss-content-alt-text@3.0.8'
  - '@csstools/postcss-contrast-color-function@3.0.16'
  - '@csstools/postcss-gamut-mapping@3.0.16'
  - '@csstools/postcss-gradients-interpolation-method@6.0.16'
  - '@csstools/postcss-hwb-function@5.0.16'
  - '@csstools/postcss-ic-unit@5.0.6'
  - '@csstools/postcss-image-function@1.0.7'
  - '@csstools/postcss-light-dark-function@3.0.8'
  - '@csstools/postcss-logical-viewport-units@4.0.4'
  - '@csstools/postcss-oklab-function@5.0.16'
  - '@csstools/postcss-progressive-custom-properties@5.1.5'
  - '@csstools/postcss-relative-color-syntax@4.0.16'
  - '@iconify/json@2.2.550'
  - '@vue/language-core@3.3.14'
  - open-graph-scraper@6.13.0
  - postcss-color-functional-notation@8.0.16
  - postcss-double-position-gradients@7.0.6
  - postcss-lab-function@8.0.16
  - postcss-preset-env@11.6.2
  - vue-tsc@3.3.14
# lockfile から消えた版を minimumReleaseAgeExclude / trustPolicyExclude から自動で外す(pnpm 11.22+)
minimumReleaseAgeExcludePrune: true

shellEmulator: true

supportedArchitectures:
  cpu:
    - x64
  os:
    - darwin
    - current

trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  - chokidar
  - rollup
  - semver
  - tinyexec
  - undici-types
  - '@trickfilm400/rollup-plugin-off-main-thread'

overrides:
  # @hono/node-server は 1系の最新に留める。
  # 対象アドバイザリは2件:
  #   1. serveStatic の Directory Traversal (CVE-2026-39406,
  #      GHSA-92pp-h63x-v22m) → 1.19.13 で修正済み
  #   2. serve-static の Windows 限定パストラバーサル
  #      (GHSA-frvp-7c67-39w9, %5C 経由) → 修正は 2.0.5 以降のみ
  #
  # 2 は 1系に修正版が無いが、(a) Windows 限定でデプロイ先は Linux、
  # (b) @modelcontextprotocol/sdk が ^1.19.9 を宣言しており 2系の強制は
  # 契約違反、(c) 当該SDKは本番成果物に含まれ実行時に到達しうる、
  # の3点から 2系へは上げず 1系最新に留めて上流の対応を待つ。
  '@hono/node-server': ^1.19.17
  # vue-i18n と @intlify/*: escapeParameter が翻訳文の srcdoc を通した XSS を防げない
  # (GHSA-83rm-6c8r-g728、High)と、同じ呼び出しで渡した名前付きの値がエスケープされない
  # (GHSA-8rc2-428q-7ww3、Low)。修正版は 11.4.14。2026-10-31 追加。docus > @nuxtjs/i18n が
  # ^11.4.8 で牽引し、ブラウザにも配られる。6 パッケージは同じ版でそろえる(vue-i18n は下の v の位置)。
  '@intlify/core': ^11.4.14
  '@intlify/core-base': ^11.4.14
  '@intlify/devtools-types': ^11.4.14
  '@intlify/message-compiler': ^11.4.14
  '@intlify/shared': ^11.4.14
  '@nuxt/content': 3.16.2
  # セキュリティ: Snyk指摘のcritical対応 (handlebars: JS注入, shell-quote: エスケープ不備)
  # 以下は pnpm audit(npm advisory DB) 由来。いずれも同一メジャー内のパッチ
  # 更新で解決するため、メジャーを跨がないようレンジを区切って指定する。
  # basic-ftp: 複数のプロトコル処理不備
  basic-ftp@^5.0.0: ^5.3.1
  # body-parser: URLエンコードのパラメータ数制限の不備
  # 2026-10-24: GHSA-27r3-jxmh-p828 (本文の後ろに余分なバイトがあると DoS) で 1.20.9 / 2.4.0 へ
  body-parser@^1.0.0: ^1.20.9
  body-parser@^2.0.0: ^2.4.0
  # brace-expansion の連続する空 {} グループによる指数時間展開 DoS。
  # メジャーごとにレンジを区切って各系統の最新へ引き上げる。
  #
  # 一律 5.0.9 に統一してはいけない。v5 は呼び出し規約を変えており、
  # 下位系統を引く minimatch がどちらの入口からも壊れる(いずれも実測):
  #   minimatch 9.x (ESM, `import expand from 'brace-expansion'`)
  #     → 「does not provide an export named 'default'」で落ちる
  #   minimatch 3.x/5.x (CJS, `require('brace-expansion')`)
  #     → 戻り値が object になり関数として呼べない({ expand, EXPANSION_MAX,
  #       EXPANSION_MAX_LENGTH })。呼ぶなら `.expand(...)` が要る
  #
  # 2026-08-09: 1系/2系にも修正版が出たので上流の対応待ちを解消した
  # (以前は 1.1.16 / 2.1.2 が各系統の最新で、修正版が無かった)。
  # 2026-10-04: GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 (再帰によるスタック枯渇) と
  # GHSA-q2hr-2g5m-vwhr (二次時間展開) で 1.1.21 / 2.1.7 / 5.0.12 へ。
  brace-expansion@^1.0.0: ^1.1.21
  brace-expansion@^2.0.0: ^2.1.7
  brace-expansion@^5.0.0: ^5.0.12
  # colord: 色文字列パースの ReDoS (GHSA-2wm5-q62r-hmrv)。stylelint 経由の dev only。
  colord@^2.0.0: ^2.9.4
  # compression: 途中で切断されたレスポンスによるメモリリーク DoS (GHSA-vc2v-76pw-4v95、修正版 1.8.2)。
  # 2026-10-24 追加。@lhci/cli (dev) と、@nuxt/cli 経由の serve (preview 用) が牽引する。
  compression@^1.0.0: ^1.8.2
  # devalue: nuxt 本体(@nuxt/nitro-server)と @nuxt/hints が 5.9.0 を牽引。
  # 2026-09-25: 5.9.4 で SNYK-JS-DEVALUE-20044498 (CVE-2026-92708、Buffer のシリアライズで
  # 背後の ArrayBuffer 全体を出力し共有メモリプールの無関係なデータが漏れる。修正版 5.9.3) と
  # SNYK-JS-DEVALUE-19883911 (CVE-2026-81176、不正入力による DoS。修正版 5.9.1) に対応。
  # 6系はメジャーのため上げない。
  devalue@^5.0.0: ^5.9.4
  # esbuild: 開発サーバへの任意リクエスト送信(<=0.24.2)と Windows での
  # 任意ファイル読み取り(0.27.3〜0.28.0)。いずれも開発サーバ限定で本番成果物に
  # 影響はないが、複数系統がツリーに居るため 0.28.1 に統一する。
  esbuild: ^0.28.1
  # express-rate-limit: レート制限の回避
  express-rate-limit@^8.0.0: ^8.2.2
  # fast-uri: URIパースのReDoS。3.1.5 で Interpretation Conflict も解消。
  # 3.1.6 (2026-08-23) で host confusion / SSRF 系4件を解消:
  #   GHSA-fph4-wmhf-6fwf (hostname の繰り返し%デコード)
  #   GHSA-5jgf-p345-68v8 (scheme-relative 参照での IDN 正規化スキップ)
  #   GHSA-jqff-g426-hqxp (%エンコードされた scheme の正規化)
  #   GHSA-f65p-4m7j-42xc (不正な IPv6 の正規化)
  #   2026-09-03: 3.1.7 で SNYK-JS-FASTURI-19502854 (閉じ ] の無い host を返す
  #   Host Confusion) と SNYK-JS-FASTURI-19502739 (port に非数字を連結する
  #   authority 注入) に対応
  #   2026-09-17: 3.1.8 で SNYK-JS-FASTURI-19846649 (CVE-2026-86472、host の %エンコード大文字を
  #   正規化せず allowlist / denylist を迂回できる Improper Handling of Case Sensitivity) に対応
  #   2026-10-24: 3.1.9 で GHSA-w74x-v6f9-j3xg (%エンコードされた scheme のデコードによる scheme 偽装)・
  #   GHSA-wjr9-j795-jxcr (WHATWG の host 正規化を検査しない host confusion) ほか Low 2件に対応
  fast-uri@^3.0.0: ^3.1.9
  handlebars: ^4.7.9
  # postcss<8.5.16 の Directory Traversal 対応。cssnano 系と @tailwindcss/postcss が
  # 8.5.15 を牽引するため 8.5.23 を強制する。
  # hono: 複数のリクエスト処理系の不具合(Nitro/@hono/node-server 経由)
  # 2026-09-03: 4.13.5 で SNYK-JS-HONO-19499091 (query が # 以降も解析される
  # Request Smuggling)、SNYK-JS-HONO-19499068 (toSSG の Directory Traversal)、
  # SNYK-JS-HONO-19499093 (parseBody の入れ子無制限によるメモリ枯渇) に対応
  # 2026-09-25: 4.13.9 で SNYK-JS-HONO-19964059 (CVE-2026-93981、XSS。修正版 4.13.7) に対応
  # 2026-10-24: 4.13.11 で GHSA-5r4p-p66f-jhc7 (serveStatic がパスを二重にデコードし、静的パスのミドルウェアを迂回できる) に対応
  hono@^4.0.0: ^4.13.11
  # ip-address: パース不備
  # 2026-10-24: 10.7.4 で GHSA-rxp7-6hxx-x8q5 (Address6 のゾーン ID 照合が長さ制限より先に二次時間かかる) に対応
  ip-address@^10.0.0: ^10.7.4
  # isomorphic-git: getRemoteInfo が ref 名の __proto__ セグメントを検証せず
  # Prototype Pollution を起こす(SNYK-JS-ISOMORPHICGIT-19784422、修正版 1.42.0)。
  # @nuxt/content 3.15.2 が ^1.38.9 を宣言するので同一メジャー内で最新へ。
  isomorphic-git: ^1.42.2
  # js-cookie: Cookie の取り扱い不備
  js-cookie@^3.0.0: ^3.0.6
  # js-yaml: マージキー連鎖による二次的CPU消費(@lhci/utils が 3系を牽引)
  # 2026-09-03: 空マッピングが maxTotalMergeKeys に数えられない CPU 消費
  # (SNYK-JS-JSYAML-19496768)対応で 3.15.2 / 4.3.2 に引き上げ。4系は
  # cosmiconfig / @rollup/plugin-yaml / json-schema-ref-parser が牽引する。
  js-yaml@^3.0.0: ^3.15.2
  js-yaml@^4.0.0: ^4.3.2
  # @tiptap/*: mergeAttributes() が own の __proto__ キーを継承 DOM 属性として
  # 実行可能にしてしまう Prototype Pollution(GHSA-cp6q-959q-f8rh、修正版 3.30.4)。
  # @nuxt/ui が牽引。拡張パッケージが @tiptap/core を exact 固定しているため、
  # core だけでなく tiptap 一式を同じバージョンに揃える(pnpm の override は
  # `@tiptap/*` のようなパターンを解決に使わないので個別に列挙)。
  # 2026-09-10: 3.31.3 に引き上げ。GHSA-j95f-988m-3j2f (Markdown 属性パーサの ReDoS、
  # 修正版 3.30.5)、GHSA-c8x8-7fp4-3x9w (prosemirror-view の XSS、3.31.2)、
  # GHSA-pmh9-4rj3-c67g (CollaborationCaret の CSS injection、3.31.3) に対応。
  '@tiptap/core@^3.0.0': ^3.31.3
  '@tiptap/extension-blockquote@^3.0.0': ^3.31.3
  '@tiptap/extension-bold@^3.0.0': ^3.31.3
  '@tiptap/extension-bubble-menu@^3.0.0': ^3.31.3
  '@tiptap/extension-bullet-list@^3.0.0': ^3.31.3
  '@tiptap/extension-code@^3.0.0': ^3.31.3
  '@tiptap/extension-code-block@^3.0.0': ^3.31.3
  '@tiptap/extension-collaboration@^3.0.0': ^3.31.3
  '@tiptap/extension-document@^3.0.0': ^3.31.3
  '@tiptap/extension-drag-handle@^3.0.0': ^3.31.3
  '@tiptap/extension-drag-handle-vue-3@^3.0.0': ^3.31.3
  '@tiptap/extension-dropcursor@^3.0.0': ^3.31.3
  '@tiptap/extension-floating-menu@^3.0.0': ^3.31.3
  '@tiptap/extension-gapcursor@^3.0.0': ^3.31.3
  '@tiptap/extension-hard-break@^3.0.0': ^3.31.3
  '@tiptap/extension-heading@^3.0.0': ^3.31.3
  '@tiptap/extension-horizontal-rule@^3.0.0': ^3.31.3
  '@tiptap/extension-image@^3.0.0': ^3.31.3
  '@tiptap/extension-italic@^3.0.0': ^3.31.3
  '@tiptap/extension-link@^3.0.0': ^3.31.3
  '@tiptap/extension-list@^3.0.0': ^3.31.3
  '@tiptap/extension-list-item@^3.0.0': ^3.31.3
  '@tiptap/extension-list-keymap@^3.0.0': ^3.31.3
  '@tiptap/extension-mention@^3.0.0': ^3.31.3
  '@tiptap/extension-node-range@^3.0.0': ^3.31.3
  '@tiptap/extension-ordered-list@^3.0.0': ^3.31.3
  '@tiptap/extension-paragraph@^3.0.0': ^3.31.3
  '@tiptap/extension-placeholder@^3.0.0': ^3.31.3
  '@tiptap/extension-strike@^3.0.0': ^3.31.3
  '@tiptap/extension-text@^3.0.0': ^3.31.3
  '@tiptap/extension-underline@^3.0.0': ^3.31.3
  '@tiptap/extensions@^3.0.0': ^3.31.3
  '@tiptap/markdown@^3.0.0': ^3.31.3
  '@tiptap/pm@^3.0.0': ^3.31.3
  '@tiptap/starter-kit@^3.0.0': ^3.31.3
  '@tiptap/suggestion@^3.0.0': ^3.31.3
  '@tiptap/vue-3@^3.0.0': ^3.31.3
  # launch-editor: Windows の UNC パス経由の NTLMv2 ハッシュ漏洩(@nuxt/devtools 経由)
  # 2026-10-24: 2.14.2 で GHSA-587h-7wmj-h5pm (Windows で存在確認を回避、High)・GHSA-r825-w8mm-5pxw
  # (エディタの CLI フラグの誤解釈によるコマンド実行)・GHSA-698v-4r3x-3vcv (% のエスケープ漏れ) に対応。
  # Snyk の通知は「No remediation available yet」だったが、修正版は 10-20 に出ていた。dev のみ。
  launch-editor@^2.0.0: ^2.14.2
  # linkify-it: リンク検出のReDoS
  linkify-it@^5.0.0: ^5.0.2
  # lodash-es: プロトタイプ汚染系
  lodash-es@^4.0.0: ^4.18.0
  # markdown-it: パースのReDoS
  # 2026-10-24: 14.3.3 で GHSA-gfr2-rv44-r23c (複数行のリンク参照定義の二次時間レンダリング、High)・
  # GHSA-vfgh-jcmw-g37q (html 有効時のインライン HTML の二次時間 DoS) に対応。
  # Snyk の通知は「No remediation available yet」だったが、修正版は 10-20 に出ていた。
  markdown-it@^14.0.0: ^14.3.3
  # nanoid: 非整数の size を渡したときの無限ループ。postcss が牽引する。
  # postcss@8.5.23 は `^3.3.16` を宣言しているので 3系に留める(4系以降を
  # 強制すれば契約違反になるうえ、CJS の入口が無い — main を持つのは 3系だけ)。
  nanoid@^3.0.0: ^3.3.18
  # node-forge: 2026-10-31 追加。1.4.1 で 12 件に対応(High 6 件: RSA PKCS#1 v1.5 の署名検証
  # GHSA-86w9-cpqp-85rv、PEM の ReDoS GHSA-7wch-p9px-956x、PKCS#12 の MAC 偽造 GHSA-jc66-7q78-782g、
  # TLS の DoS GHSA-8hrf-8g6f-7xwp / GHSA-hqq3-7jhf-c5jx、X.509 basicConstraints の回避 GHSA-5x38-2vff-x55p)。
  # 以前は最新が 1.4.0 で修正版が無く、上流待ちにしていた。listhen の dev 用証明書生成で使う。
  node-forge: ^1.4.1
  # path-to-regexp: パターンのReDoS。0系と8系が同居する
  path-to-regexp@^0.1.0: ^0.1.13
  path-to-regexp@^8.0.0: ^8.4.0
  postcss: ^8.5.23
  # postcss-selector-parser: SNYK の Inefficient Algorithmic Complexity (7.1.5 以前)。
  # 2026-10-08: 7.1.6 で解消。postcss 系プラグインが牽引する推移的依存。
  postcss-selector-parser: ^7.1.6
  # proxy-addr: IPv4-mapped IPv6 のサブネット判定不備で trust proxy を欺き
  # req.ip を偽装できる User Impersonation(SNYK-JS-PROXYADDR-19812342、修正版 2.0.8)。
  # express 4 (@lhci/cli 経由 dev) と express 5 (@modelcontextprotocol/sdk 経由 本番) の両方が牽引。
  proxy-addr: ^2.0.8
  # qs: パラメータ処理の不備。6.16.0 で Snyk 指摘の Medium 2件を解消:
  #   SNYK-JS-QS-19432019 (isBuffer() の callable 未確認による Uncaught Exception)
  #   SNYK-JS-QS-19432017 (parseArrayValue() の arrayLimit 未適用によるメモリ枯渇)
  # 2026-10-19: 10/16 の Snyk 通知 (qs 6.16.0 の Uncaught Exception、H) の修正版は未公表だったが、
  # 10/14 公開の 6.16.1 に stringify の例外修正 (toString が呼べない要素で throw しない) が入ったので上げる。
  # Snyk 側で解消と判定されるかは未確認。
  qs@^6.0.0: ^6.16.1
  # セキュリティ: sharp<0.35.0 の libvips 由来 Heap/Integer Overflow
  # (CVE-2026-33327/33328/35590/35591, GHSA-F88M-G3JW-G9CJ) 対応。
  # @nuxt/image が 0.34.5 を牽引するため 0.35.0+ (libvips 8.18.3) を強制。
  # serialize-javascript: XSS。6系に修正版がなく @rollup/plugin-terser 経由
  # のビルド時利用のみのため 7系へ上げる。
  # 2026-10-24: 7.1.3 で GHSA-m5mm-p8h7-m29v (関数本体末尾の </script による XSS、Low) に対応
  serialize-javascript: ^7.1.3
  # seroval: SNYK の Allocation of Resources Without Limits (1.6.2 以前)。
  # 2026-10-08: 1.6.3 以降で解消。nuxt (@nuxt/vite-builder) が牽引する推移的依存。
  # 2026-10-31: 1.6.11 で GHSA-9wx9-5pv9-3349(RegExp のソースによるスクリプト注入)と
  # GHSA-f86p-h4j2-7qgj(typed array の constructor プロパティ経由のコード注入)に対応。
  seroval: ^1.6.11
  # 2026-09-10: 0.35.4 で GHSA-rgj7-g3m4-5g8c (Heap Overflow) に対応。
  # 2026-10-08: 0.35.5 で Use After Free (Snyk) に対応。
  sharp: ^0.35.5
  shell-quote@^1.0.0: ^1.12.0
  # socket.io-parser: パース不備。4.2.7 で Improper Check for Unusual or
  # Exceptional Conditions も解消
  socket.io-parser@^4.0.0: ^4.2.7
  # svgo: SVG 最適化時の不具合
  # 2026-09-10: 4.1.0 で removeScripts プラグインの XSS 2件
  #   GHSA-w27v-7q3p-w38r (名前空間付き <svg:a> と制御文字入り URL スキームの回避)
  #   GHSA-4vpr-x523-8j87 (<foreignObject> 内の HTML イベントハンドラ未除去)
  # に対応。4.1.0 は sax 1.6.1 固定で XML 検証が厳格化されるため generate で検証済み。
  svgo@^4.0.0: ^4.1.0
  # tar: 展開時のDoS/パス解釈差異(CRITICAL 含む)
  tar@^7.0.0: ^7.5.21
  # tinypool: worker のオプション経由の Prototype Pollution → RCE (GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr、
  # Critical、修正版 2.1.2)。2026-10-24 追加。eslint-plugin-format → oxfmt 経由の dev のみ。
  tinypool@^2.0.0: ^2.1.2
  # tmp: prefix/postfix のサニタイズ不備によるディレクトリ脱出。
  # external-editor / @lhci/cli 経由。require("tmp") の名前空間利用のため影響なし。
  tmp: ^0.2.7
  # undici: 2026-09-04 の一括 advisory(cache interceptor のクロスオリジン汚染 GHSA-vp8m-p9jh-q5pm、
  # BalancedPool の TLS 検証コールバック欠落 GHSA-w293-vg96-wgc3、WebSocket サブプロトコルの
  # 未処理 TypeError GHSA-rfgv-xxqx-mfg5 ほか 8 件)。
  # 6/7/8 系が共存するのでメジャーごとに区切る。6 系: @nuxt/scripts / node-gyp 12 / @ai-sdk、7 系: jsdom / cheerio、8 系: nuxt 本体 / unifont。
  # 2026-10-20: 10-15 の一括 advisory(Agent の TLS オプション欠落 GHSA-2m5v-pch6-74hx、TLS 1.2 の
  # 再ネゴシエーション DoS GHSA-qrxm-fqhp-jwvm、content-encoding の未処理エラー GHSA-xjj6-f33q-929c
  # ほか 7 件)に合わせて下限を 6.29.1 / 7.30.1 / 8.12.2 へ。Snyk の通知は「No remediation available
  # yet」だったが、修正版は 10-15 に出ていた。
  undici@^6.0.0: ^6.29.1
  undici@^7.0.0: ^7.30.1
  undici@^8.0.0: ^8.12.2
  # uuid: v3/v5/v6 で buf 指定時の境界チェック漏れ。@lhci/cli 経由。
  # v11 は名前付きエクスポートのみだが require("uuid") 形式なので影響なし。
  uuid: ^11.1.1
  # 以下 vite 系5つは、vite 7 までしか peer 宣言していない版が依存ツリーに残るため
  # vite 8 対応版へ引き上げる。**下の `vite@^7.0.0` の引き上げとセットで初めて成立する。**
  # 片方だけだと peer conflict が報告されないまま非対応の組み合わせを飲み込む
  # （それで PR #18 は失敗した）。いずれも @nuxt/devtools と @vite-pwa/nuxt の配下。
  vite-dev-rpc: ^2.0.0
  vite-hot-client: ^2.2.0
  vite-plugin-inspect: ^11.4.1
  vite-plugin-pwa: ^1.3.0
  vite-plugin-vue-tracer: ^1.4.0
  # vite: 開発サーバのファイル読み取り対応で 7.3.5+ を要求していたが、7系のままだと
  # vitest 4 が動かない（rolldown ベースの vite 8 を前提にしており、rolldown を持たない
  # vite 7 では transform 時に「Missing field `moduleType`」で全 spec が落ちる）。
  # 8系はこのアドバイザリを当然満たすので、8系へ寄せる。
  #
  # **完了条件に `pnpm peers check` を使わないこと。** この override は
  # pnpm-lock.yaml 上の peerDependencies 宣言ごと書き換えるため、非互換な
  # パッケージも「充足」と表示される。`pnpm check:vite-peers` で上流の宣言と
  # 突き合わせること（scripts/check-vite-peers.ts の冒頭に経緯あり）。
  vite@^7.0.0: ^8.1.5
  # vue-i18n: 上の @intlify/* と同じ(GHSA-83rm-6c8r-g728)。
  vue-i18n: ^11.4.14
  ws@7: ^7.5.13
  # ws CVE-2026-48779 (fragment枯渇によるOOM) 対応。7系は7.5.11でバックポート修正、
  # 8系は8.21.0で修正されたが対策が不完全だったため8.21.1を要求する
  ws@8: ^8.21.1
  # zod: 制約付きの巨大なコレクションの検証でメモリ枯渇 (GHSA-mrhx-c7xc-m3w5、High、修正版 4.6.6)。
  # 2026-10-24 に ^4.4.3 から引き上げ。下の「修正版なし」の zod は SNYK-JS-ZOD-20510278 で別の指摘。
  zod: ^4.6.6
  zod-to-json-schema: ^3.25.2
  # --- 以下は override しない(上流待ち)。2026-09-25 時点の Snyk 指摘 ---
  # 修正版が存在しない(npm の最新が現行版):
  #   braces 3.0.3 (SNYK-JS-BRACES-19963945、Uncontrolled Recursion)
  #   deepmerge 4.3.1 (SNYK-JS-DEEPMERGE-19964053、Prototype Pollution)
  #   uri-js 4.4.1 (SNYK-JS-URIJS-19963963 Infinite loop / -19963961 Improper Encoding)
  #   picomatch 2.3.2 / 4.0.7 (SNYK-JS-PICOMATCH-21248802、ReDoS。全バージョンが対象で修正版なし。
  #   ビルド時のグロブ展開で、パターンは開発者が書いたものだけ。2026-10-20 追記)
  #   zod 4.x (SNYK-JS-ZOD-20510278 / CVE-2023-54404、$ZodArray が要素ごとの issue を上限なく溜める。
  #   全バージョンが対象で修正版なし。上流 PR colinhacks/zod#6475 は未マージで閉鎖。2026-10-08 追記)
  #   extract-zip 2.0.1 (GHSA-7pqw-9j4j-h8q3 / GHSA-jmr9-qjv8-65gv、@lhci/cli 経由の dev only)
  # 修正がメジャー更新でしか提供されず、牽引元の宣言レンジを破る:
  #   ioredis 5.x (SNYK-JS-IOREDIS-19963957、修正は 6.x。unstorage 等が ^5 を宣言)
  #   @apidevtools/json-schema-ref-parser 14.x (SNYK-JS-APIDEVTOOLSJSONSCHEMAREFPARSER-17937352、
  #   修正は 15.3.6。json-schema-to-typescript-lite 15.0.0 が ^14 を宣言)
  # 2026-10-31 追記(pnpm audit。修正がメジャー更新でしか提供されず、牽引元の宣言レンジを破る):
  #   glob 10.x〜13.x (AbortSignal による中断の回避、修正は 14.0.2) と minimatch 3.x〜10.x
  #   (DoS、修正は 11.0.1)。多数のビルドツールが旧メジャーを宣言している
  #   basic-ftp 5.3.1 (修正は 6.2.1。@lhci/cli > proxy-agent > get-uri 経由の dev only)
  #   katex 0.16.47 (Low、修正は 0.18.2。@antfu/eslint-config > @eslint/markdown 経由の dev only)
  # 2026-09-26 解消: nuxt-og-image 6.6.0 (GHSA-q8hw-4fvp-9rwv、SSRF) は docus 5.13.0 への更新で 6.7.8 になった
packageExtensions:
  '@nuxt/content':
    dependencies:
      zod: '*'
      zod-to-json-schema: '*'
